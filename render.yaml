services:
  - type: web
    name: civicsphere-enio-brito
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    disk:
      name: civicsphere-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: APP_USER
        value: admin
      - key: APP_PASSWORD
        generateValue: true
      - key: CIVICSPHERE_DATA_DIR
        value: /opt/render/project/src/data